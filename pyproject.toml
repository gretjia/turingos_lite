[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turingos*", "audits*"]

[project]
name = "turingos-lite"
version = "0.1.0"
description = "TuringOS Lite v1.0 - Dual independent Git Tape local Agentic operation workbench (Software 3.0 harness)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "rich",
    "textual",
    "openai>=1.0",
    "pytest",
    "keyring",
]

[project.scripts]
turing = "turingos.__main__:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
